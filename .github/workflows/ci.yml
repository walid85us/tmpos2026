# Phase 4.0 M2 — CI production gates. Single least-privilege workflow.
# Enforces: zero-error typecheck, deterministic tests, Firestore STATIC guard +
# SEMANTIC emulator suite (Java 17+, demo- project, NO secrets), isolated build
# integrity, dependency-audit (SCA), Semgrep (SAST), secret scan (current +
# history), and forbidden-artifact scan. New/changed Critical/High findings
# block; known findings are reconciled ONLY against the itemized, expiring
# security gate manifest (docs/phase-4/m2-security-gate-manifest.json).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # M7A-CUSTOMERS-P5 — 30, not 20: the job ran 18m56s at the stage's entry, before the customer directory scenarios
    # were added to the shop browser step below.
    timeout-minutes: 30
    # Phase 4.0 M3 S1b — DISPOSABLE PostgreSQL for the migration-executor proof. It is created
    # and destroyed with this job, reachable only on the runner's loopback interface, holds a
    # database named `tmpos_s1b_*`, and authenticates a synthetic bootstrap role through
    # trust auth, so no credential is committed at all.
    # It is bound to the tests ONLY through TM_POS_TEST_DATABASE_URL — DATABASE_URL,
    # SUPABASE_DATABASE_URL and APP_DATABASE_URL are never set here. Each step also declares
    # TM_POS_TEST_DATABASE_KIND: the harness accepts a TCP target only as this declared service
    # (M7A-DBTEST-ISOLATION-P0), and every step runs through scripts/run-db-tests.mjs, which
    # hands each suite a minimal environment with no PG* setting.
    services:
      tmpos_s1b_postgres:
        # postgres:16-alpine, linux/amd64 manifest, pinned by digest like every other image here.
        image: postgres@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_USER: tmpos_s1b_owner
          POSTGRES_DB: tmpos_s1b_ci
          # No password exists to leak: the instance is disposable, lives only inside this job,
          # and is reachable only on the runner's loopback interface. Trust auth removes the
          # credential entirely rather than committing a secret-shaped literal and waiving it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Bounded health check: the job waits for a real connection rather than a sleep.
        options: >-
          --health-cmd "pg_isready -U tmpos_s1b_owner -d tmpos_s1b_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      # actions/setup-node@v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
          cache: npm
      # actions/setup-java@v4.5.0 (Temurin 21 — firebase-tools requires Java 21+)
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b
        with:
          distribution: temurin
          java-version: '21'
      # Runs BEFORE npm ci, and must: a lockfile pointing at an environment-internal
      # registry cannot be caught afterwards. npm marks some packages `devOptional` and
      # SKIPS them silently when their tarball is unreachable, so `npm ci` exits 0 with the
      # package absent — that is how a green install shipped without @types/react. The
      # checker uses only Node built-ins, so it needs no install to run. Mandatory, never
      # `--if-present`: a missing script must fail rather than skip.
      - name: Lockfile portability (public registry only — must run before install)
        run: npm run lockfile:check
      - run: npm ci
      # Runs BEFORE the ratchet and stays permanently: proves WHICH tsconfig the
      # ratchet compiles and that the React type declarations are actually present.
      # Without this a missing @types/react silently turns every JSX element into
      # `any`, and the ratchet reports zero while checking nothing.
      - name: Typecheck contract (selected config + React types must be explicit)
        run: npm run typecheck:contract
      - name: Typecheck (ratchet — must be zero)
        run: npm run typecheck
      - name: Deterministic tests (existing suites)
        run: npm run test:existing
      # M7A-DBTEST-ISOLATION-P0 — the ambient-fallback incident reproduced against the real database suites: the step's
      # children get synthetic PG*/DATABASE_URL settings that point at a listener the test owns, and a suite that dials it
      # has fallen back. No database service is used. The fast half runs in `npm run test:existing` above.
      - name: Database tests never fall back to an ambient database (M7A-DBTEST-ISOLATION-P0)
        run: node_modules/.bin/tsx --test tests/quality/db-test-ambient-fallback.suites.mjs
      # Phase 4.0 M3 S1b — the trusted executor against the disposable service above. Proves
      # session-scoped advisory locking, stable backend identity across per-file commits, durable
      # dirty markers, and idempotent reruns against REAL PostgreSQL. Bound exclusively through
      # TM_POS_TEST_DATABASE_URL; the executor refuses any non-disposable, non-local target.
      - name: Migration executor against disposable PostgreSQL (S1b)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: npm run test:db
      # Phase 4.0 M6-PG-P4 — the PostgreSQL transactional store (migration 006 and its adapter) against the SAME
      # disposable service, after the suites above have applied 001-006 to it. Same binding, no new service, no
      # secret, no permission change.
      - name: Transactional store against disposable PostgreSQL (M6-PG-P4)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/transactionalStore.integration.test.mjs
      # Phase 4.0 M5-ID-P1 — migration 007's trusted principal resolution and transaction-local
      # revalidation against the SAME disposable service, after 001-006 are already applied to it.
      # Same binding, no new service, no secret, no permission change.
      - name: Trusted principal resolution against disposable PostgreSQL (M5-ID-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/principalResolution.integration.test.mjs
      # Phase 4.0 M5-GIAM-D1-P1 — migration 008 and the first server-authorized business command (the tenant display
      # name) through the store and the HTTP chain, against the SAME disposable service after 001-007 are applied to it.
      # Same binding, no new service, no secret, no permission change.
      - name: Tenant display-name command against disposable PostgreSQL (M5-GIAM-D1-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/tenantDisplayName.integration.test.mjs
      # Phase 4.0 M5-GIAM-D1-P2 — migration 010 and the tenant lifecycle command (suspend/reactivate) through the
      # store: the access version, the privilege containment, the audit record and event, concurrency, and 010's
      # apply, upgrade and rollback — against the SAME disposable service after 001-009 are applied to it.
      # Same binding, no new service, no secret, no permission change.
      - name: Tenant status command against disposable PostgreSQL (M5-GIAM-D1-P2)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/tenantStatus.integration.test.mjs
      # Phase 4.0 M5-GIAM-D1-P2-R1 — migration 011 and EFFECTIVE tenant revocation: the durable session store,
      # the composed PostgreSQL admission, and the suspend/reactivate sequence over real local sockets, against
      # the SAME disposable service after 001-011 are applied to it. This is the suite DA-32's closure rests on,
      # so it runs here rather than only locally. Same binding, no new service, no secret, no permission change.
      - name: Effective tenant revocation against disposable PostgreSQL (M5-GIAM-D1-P2-R1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/tenantAdmission.integration.test.mjs
      # Phase 4.0 M5-GIAM-D1-P3 — migration 012 and the platform tenant directory: the gated read routine, its privilege
      # containment, and the Tenant Management page's read and commands over the real resolver, authorizer and store on real
      # local sockets, against the SAME disposable service after 001-012 are applied to it. Same binding, no new service, no
      # secret, no permission change.
      - name: Platform tenant directory against disposable PostgreSQL (M5-GIAM-D1-P3)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/tenantDirectory.integration.test.mjs
      # Phase 4.0 M5-GIAM-D1-P4 — migration 013 and durable platform-administrator admission: the per-actor platform
      # authority version, the four ENABLE ALWAYS row triggers that move it — on platform_identity (its anchor only),
      # app_user, identity_link and user_membership (platform scope only) — on every change to an administrator's standing
      # but an updated_at-only update, the admission read and its privilege containment, against the SAME disposable
      # service after 001-013 are applied to it. Same binding, no new service, no secret, no permission change.
      - name: Platform admission against disposable PostgreSQL (M5-GIAM-D1-P4)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/platformAdmission.integration.test.mjs
      # Phase 4.0 M5-GIAM-D1-P4 — the administrative session boundary composed over migration 013's admission and the
      # authorizer deciding on the scope it selected, over real local sockets, against the SAME disposable service. Same
      # binding, no new service, no secret, no permission change.
      - name: Administrative session boundary against disposable PostgreSQL (M5-GIAM-D1-P4)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/adminBoundary.integration.test.mjs
      # Phase 4.0 M5-ADMIN-REVOKE-P1 — administrative revocation under concurrency: logouts, revocations, grant changes,
      # identity changes, recent sign-ins and tenant commands raced across two separately composed production roots over
      # real local sockets, against the SAME disposable service. Commit order is asserted through lock waits here (the
      # service keeps track_commit_timestamp off). Same binding, no new service, no secret, no permission change.
      - name: Administrative revocation ordering against disposable PostgreSQL (M5-ADMIN-REVOKE-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/adminRevocation.integration.test.mjs
      # Phase 4.0 M5-TENANT-SESSION-P1 — migration 016 and tenant session ordering: tenant logins, recent sign-ins and
      # logouts raced against account, grant, anchor, tenant and store changes across two separately composed production
      # roots over real local sockets, with the tenant session audit rows, against the SAME disposable service. The
      # tenant-scope witness route is test-only; since M7B-INVOICES-P1 the store-scope request is the real draft list,
      # which saves nothing. Same binding, no new service, no secret, no permission change.
      - name: Tenant session ordering against disposable PostgreSQL (M5-TENANT-SESSION-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/tenantSessionOrdering.integration.test.mjs
      # Phase 4.0 M7A-CUSTOMERS-P1 — migration 017 and the tenant customer directory: GET /api/v1/customers composed on
      # the tenant session boundary over real local sockets, the routine's re-check, isolation, paging and 017's rollback
      # (028 down to 020, then 018, rolled back first and re-applied after it in order, the catalog left exactly as found),
      # against the SAME disposable service. Synthetic data only. Same binding, no new service, no secret, no permission change.
      - name: Tenant customer directory against disposable PostgreSQL (M7A-CUSTOMERS-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/customerDirectory.integration.test.mjs
      # Phase 4.0 M7A-CUSTOMERS-P2 — migration 018 and the tenant session mint: the issuer key the runtime login cannot
      # touch, the proof every tenant session is minted with, the replay ledger, the customer read bound to a minted, live
      # session, the login's whole privilege set, and 018's rollback — against the SAME disposable service. Synthetic data and
      # a key made at run time only. Same binding, no new service, no secret, no permission change.
      - name: Tenant session mint against disposable PostgreSQL (M7A-CUSTOMERS-P2)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/tenantSessionMint.integration.test.mjs
      # Phase 4.0 M6-RATE-P2 — migration 014 and the distributed rate limiter: the bucket store, the key fingerprint,
      # the consume and probe routines and their privilege containment, against the SAME disposable service after
      # 001-014 are applied to it. Same binding, no new service, no secret, no permission change.
      - name: Distributed rate limiter against disposable PostgreSQL (M6-RATE-P2)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/rateLimiter.integration.test.mjs
      # Phase 4.0 M6-RATE-P2 — the rate-limited runtime composed over the real PostgreSQL limiter, enforcing and
      # releasing real request budgets over real loopback sockets, against the SAME disposable service. Same binding,
      # no new service, no secret, no permission change.
      - name: Rate-limited runtime over real sockets against disposable PostgreSQL (M6-RATE-P2)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/rateLimitRuntime.integration.test.mjs
      # Phase 4.0 M6-ENTRY-P1 — production entry startup preflight (config validation,
      # database connection, migration ledger verification, login privilege check, rate
      # limiter probe) against a disposable PostgreSQL cluster over the least-privilege runtime
      # principal (001–016 migrations applied).
      - name: Production entry startup preflight against disposable PostgreSQL (M6-ENTRY-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/productionEntryPreflight.integration.test.mjs
      # Phase 4.0 M6-ENTRY-P1 — production entry runtime (composition, ports,
      # routes, containment) against a real socket bound by the entry over disposable
      # PostgreSQL.
      - name: Production entry runtime against disposable PostgreSQL (M6-ENTRY-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/productionEntry.integration.test.mjs
      # M7A-CUSTOMERS-P2 — the tenant entry end to end (configuration refusals, the startup preflight with the issuer key
      # and the parameter-logging guard, the host lock, the tenant session and the customer read, readiness under each
      # dependency's failure) over real loopback sockets, and the COMPILED tenant entry (built by the suite itself) over
      # the SAME disposable service. Synthetic hosts and data; keys made at run time only. Same binding, no new service, no
      # secret, no permission change.
      - name: Tenant entry runtime against disposable PostgreSQL (M7A-CUSTOMERS-P2)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/tenantEntry.integration.test.mjs
      # M7A-CUSTOMERS-P3 — migration 019's customer create routine as the runtime login (apply, postcondition, refused keys,
      # the role set's parity with the catalog, rollback and re-apply), then POST /api/v1/customers end to end over real
      # loopback sockets (authority, races, idempotency across two instances, failure atomicity, the lost COMMIT answer),
      # against the SAME disposable service. Synthetic data and keys made at run time only. Same binding, no new service, no
      # secret, no permission change.
      - name: Tenant customer create routine against disposable PostgreSQL (M7A-CUSTOMERS-P3)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/customerCreateRoutine.integration.test.mjs
      - name: Tenant customer create over HTTP against disposable PostgreSQL (M7A-CUSTOMERS-P3)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/customerCreate.integration.test.mjs
      # M7A-CUSTOMERS-P3-R1 — migration 020's durable per-tenant Customers level for the three editable built-in roles, as
      # the runtime login (apply, postcondition, the set / create / page routines deciding on the effective level, the
      # edit/create lock ordering, the direct-call witnesses, rollback refused while an edit differs from its default, and
      # re-apply), then the owner's role-level edit and the customer routes over real loopback sockets, against the SAME
      # disposable service. Synthetic data and keys made at run time only. Same binding, no new service, no secret, no
      # permission change.
      - name: Tenant role level routines against disposable PostgreSQL (M7A-CUSTOMERS-P3-R1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/tenantRoleLevelRoutine.integration.test.mjs
      - name: Owner role level edits over HTTP against disposable PostgreSQL (M7A-CUSTOMERS-P3-R1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/roleLevels.integration.test.mjs
      # M7A-CUSTOMERS-P4 — migration 021's conditional role-level edit as the runtime login (apply, postcondition, the
      # tenant and version preconditions, the reset-to-default ABA, the edit/edit and edit/create lock ordering, rollback
      # refused while a version row exists and giving nothing back, re-apply), then the DA-125 witnesses (tenant switch,
      # two tabs on two instances, default-reset ABA) over real loopback sockets, against the SAME disposable service.
      # Synthetic data and keys made at run time only. Same binding, no new service, no secret, no permission change.
      - name: Conditional role level edit routines against disposable PostgreSQL (M7A-CUSTOMERS-P4)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/roleLevelVersionRoutine.integration.test.mjs
      - name: Role level save preconditions over HTTP against disposable PostgreSQL (M7A-CUSTOMERS-P4)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/roleLevelPrecondition.integration.test.mjs
      # M5-INVOICES-AUTH-P1 — migration 026's Invoices level routines as the runtime login (apply, postcondition, the widened
      # CHECKs, the defaults, authority refusals, tenant and version preconditions, the reset-to-default ABA, Invoices/Customers
      # isolation, the upgrade over Customers edits, rollback refused while an Invoices row exists, re-apply), against the
      # SAME disposable service; it leaves no Invoices row and the ledger at 001-026. Synthetic data and keys made at run time
      # only. Same binding, no new service, no secret, no permission change.
      - name: Invoices role level routines against disposable PostgreSQL (M5-INVOICES-AUTH-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/invoiceRoleLevelRoutine.integration.test.mjs
      # M5-INVOICES-AUTH-P1 — the owner's Invoices level over real loopback HTTP: the tenant entry over 001-026 (the defaults
      # read-back, the durable edit read back by a second instance, Invoices/Customers and tenant isolation, edit and read
      # authority refusals, the precondition and reset-to-default ABA, a two-instance race, audit-fault atomicity, replay and
      # the lost COMMIT answer), against the SAME disposable service; it leaves no level or version row of its own in either
      # domain. Synthetic data and keys made at run time only. Same binding, no new service, no secret, no permission change.
      - name: Invoices role level edits over HTTP against disposable PostgreSQL (M5-INVOICES-AUTH-P1)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/invoiceRoleLevels.integration.test.mjs
      # M7A-CUSTOMERS-P4 — migration 022's customer detail read as the runtime login (apply, postcondition, the answers,
      # list parity, the tenant precondition, a revoked session, the timing sanity bound, the production adapter, rollback
      # alone / newest first / out of order), against the SAME disposable service; the HTTP and compiled cases run in the
      # tenant entry step above. Synthetic data and keys made at run time only. Same binding, no new service, no secret, no
      # permission change.
      - name: Tenant customer detail routine against disposable PostgreSQL (M7A-CUSTOMERS-P4)
        env:
          TM_POS_TEST_DATABASE_URL: postgres://tmpos_s1b_owner@127.0.0.1:5432/tmpos_s1b_ci
          TM_POS_TEST_DATABASE_KIND: ci-disposable-service
        run: node_modules/.bin/tsx scripts/run-db-tests.mjs tests/db/customerDetail.integration.test.mjs
      # M7A-CUSTOMERS-P6 — migration 023's customer contact records as the runtime login (023 rolled back with its own down
      # file, legacy rows seeded on 001-022, 023 re-applied by the trusted executor over them; the postcondition, the
      # privileges, the create's database clock, every refused contact class, the tenant store's rollback of a refused
      # contact, parity with 020's refusals, the profile read and its adapter, the refused and the exact rollback), against
      # the SAME disposable service; the HTTP and compiled cases run in the tenant entry step above. It leaves 023 applied and
